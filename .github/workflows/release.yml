name: Release

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: "Which version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bump version and promote CHANGES
        id: bump
        run: |
          NEW_VERSION=$(python scripts/release.py "${{ inputs.version_part }}")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Show changes
        run: |
          grep '^__version__' dsmtpd/__init__.py
          head -15 CHANGES.rst

      - name: Sanity-check the build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git add dsmtpd/__init__.py CHANGES.rst
          git commit -m "Release version $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Trigger Publish workflow
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref "v$NEW_VERSION"
